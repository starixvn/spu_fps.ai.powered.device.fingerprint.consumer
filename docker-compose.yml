version: '3.8'

services:
  fps-worker:
    build:
      context: .
      dockerfile: src/FPS.AI.Powered.Device.Fingerprint.Consumer.Worker/Dockerfile
    container_name: fps-device-fingerprint-worker
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - TZ=America/La_Paz
    restart: unless-stopped
    networks:
      - fps-network
    depends_on:
      - redis
      - rabbitmq

  redis:
    image: redis:7-alpine
    container_name: fps-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fps-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fps-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - fps-network
    restart: unless-stopped

volumes:
  redis_data:
  rabbitmq_data:

networks:
  fps-network:
    driver: bridge
